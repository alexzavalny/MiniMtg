<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магия: Учебная битва</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="fx-layer"></div>
<div id="red-flash"></div>
<button id="btn-lang" class="lang" title="Язык / Language"></button>

<div id="hud">
  <!-- opponent -->
  <div id="opp-panel" class="player-panel top">
    <div class="avatar">🤖</div>
    <div class="pinfo">
      <div class="pname"><span data-i18n="player.cpu">Компьютер</span> <span class="deckname" id="opp-deck"></span></div>
      <div class="life-row"><span class="heart">❤️</span><span class="life" id="opp-life">20</span></div>
      <div class="counts">🃏 <span id="opp-hand">0</span> &nbsp; 📚 <span id="opp-lib">0</span> &nbsp; 🪦 <span id="opp-gy">0</span> &nbsp; 🏔️ <span id="opp-lands">0/0</span></div>
      <div class="pool" id="opp-pool"></div>
    </div>
  </div>

  <!-- me -->
  <div id="my-panel" class="player-panel bottom">
    <div class="avatar">🧒</div>
    <div class="pinfo">
      <div class="pname"><span data-i18n="player.you">Вы</span> <span class="deckname" id="my-deck"></span></div>
      <div class="life-row"><span class="heart">❤️</span><span class="life" id="my-life">20</span></div>
      <div class="counts">🃏 <span id="my-hand">0</span> &nbsp; 📚 <span id="my-lib">0</span> &nbsp; 🪦 <span id="my-gy">0</span> &nbsp; 🏔️ <span id="my-lands">0/0</span></div>
      <div class="pool" id="my-pool"></div>
    </div>
  </div>

  <!-- phase track -->
  <div id="phase-track">
    <div id="turn-num" class="turn-num"></div>
    <div id="turn-label" class="turn-label"></div>
    <ul id="phases"></ul>
  </div>
  <div id="phase-hint"></div>

  <div id="stack-panel" class="hidden"></div>

  <div id="preview" class="hidden"><img alt=""><div class="ptext"></div></div>

  <div id="action-bar">
    <div id="hint"></div>
    <div class="buttons">
      <button id="btn-cancel" class="btn secondary hidden"></button>
      <button id="btn-main" class="btn hidden"></button>
    </div>
  </div>

  <div id="log"></div>

  <div id="topbar-right">
    <button id="btn-log" class="icon" data-i18n-title="btn.log">📜</button>
    <button id="btn-help" class="icon" data-i18n-title="btn.help">❓</button>
    <button id="btn-sound" class="icon" data-i18n-title="btn.sound">🔊</button>
  </div>

  <div id="banner" class="banner"></div>
</div>

<!-- start screen -->
<div id="start" class="overlay">
  <div class="panel big">
    <h1><span data-i18n="start.title">✨ МАГИЯ ✨</span><small data-i18n="start.subtitle">Учебная битва против компьютера</small></h1>
    <p class="lead" data-i18n="start.lead">Выбери колоду. У каждого игрока 20 жизней. Кто первым опустит противника до нуля — победил!</p>
    <div id="deck-picker"></div>
    <label class="opt"><input type="checkbox" id="opt-full"> <span data-i18n="start.fullControl">Останавливаться на каждой фазе (полный контроль)</span></label>
    <div class="row">
      <button id="btn-help-start" class="btn secondary" data-i18n="btn.howto">❓ Как играть</button>
      <button id="btn-start" class="btn primary large" data-i18n="btn.play">▶ Играть</button>
    </div>
  </div>
</div>

<!-- help -->
<div id="help" class="overlay hidden">
  <div class="panel">
    <button class="close">✖</button>
    <h2 data-i18n="help.title">Как играть</h2>
    <div class="help-cols">
      <div data-i18n-html="help.col1"></div>
      <div data-i18n-html="help.col2"></div>
    </div>
  </div>
</div>

<!-- game over -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <h1 data-i18n="over.win">🏆 ПОБЕДА!</h1>
    <p data-i18n="over.winText"></p>
    <button id="btn-restart" class="btn primary large" data-i18n="btn.again">🔄 Играть ещё</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cards.js"></script>
<script src="assets/card-art-data.js"></script>
<script src="assets/black-card-art-data.js"></script>
<script src="assets/tide-card-art-data.js"></script>
<script src="assets/sonic-card-art-data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/cardart.js"></script>
<script src="js/sfx.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
